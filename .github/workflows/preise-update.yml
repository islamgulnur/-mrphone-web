name: Ankaufspreise automatisch aktualisieren

# Cron ist in UTC (GitHub Actions kennt keine Zeitzonen/DST). 0 2 * * * UTC entspricht
# ca. 03:00 Uhr MEZ (Winter) bzw. 04:00 Uhr MESZ (Sommer). Zum Anpassen einfach die
# Uhrzeit hier ändern.
on:
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry-Run (rechnet + loggt, schreibt/committet nichts)"
        type: boolean
        default: false
      nur:
        description: "Optional: nur bestimmte Geräte+Varianten verarbeiten, Format 'id:Variante,id:Variante' (leer lassen für normale Rotation/Budget)"
        type: string
        default: ""
      debug_treffer:
        description: "Optional: Suchstring + erste 5 Rohtreffer (Titel/Preis/Quelle) für genau ein Gerät+Variante ins Log schreiben, Format 'id:Variante'"
        type: string
        default: ""
      alle:
        description: "Alle Geräte und Varianten statt der normalen Tagesrotation verarbeiten"
        type: boolean
        default: false
      manuelle_freigeben:
        description: "Bisher manuelle Preise einmalig wieder der Automatik übergeben"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: preise-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node einrichten
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Abhängigkeiten installieren
        run: npm install

      - name: Preisautomatik testen
        run: npm run test:preise

      - name: Ankaufspreise aktualisieren
        env:
          EBAY_CLIENT_ID: ${{ secrets.EBAY_CLIENT_ID }}
          EBAY_CLIENT_SECRET: ${{ secrets.EBAY_CLIENT_SECRET }}
          DRY_RUN_INPUT: ${{ inputs.dry_run }}
          NUR_INPUT: ${{ inputs.nur }}
          DEBUG_TREFFER_INPUT: ${{ inputs.debug_treffer }}
          ALLE_INPUT: ${{ inputs.alle }}
          MANUELLE_FREIGEBEN_INPUT: ${{ inputs.manuelle_freigeben }}
        run: |
          ARGS=()
          if [ "$DRY_RUN_INPUT" = "true" ]; then ARGS+=(--dry-run); fi
          if [ -n "$NUR_INPUT" ]; then ARGS+=(--nur="$NUR_INPUT"); fi
          if [ -n "$DEBUG_TREFFER_INPUT" ]; then ARGS+=(--debug-treffer="$DEBUG_TREFFER_INPUT"); fi
          if [ "$ALLE_INPUT" = "true" ]; then ARGS+=(--alle); fi
          if [ "$MANUELLE_FREIGEBEN_INPUT" = "true" ]; then ARGS+=(--manuelle-freigeben); fi
          node scripts/update-ankaufspreise.js "${ARGS[@]}"

      - name: Änderungen committen (nur bei echten Änderungen, nie bei Dry-Run)
        if: ${{ inputs.dry_run != true }}
        run: |
          if git diff --quiet; then
            echo "Keine Preisänderungen – kein Commit."
            exit 0
          fi

          DATUM=$(node -e "console.log(JSON.parse(require('fs').readFileSync('preisupdate-meta.json','utf8')).datum)")
          AKTUALISIERT=$(node -e "console.log(JSON.parse(require('fs').readFileSync('preisupdate-meta.json','utf8')).aktualisiert)")
          UEBERSPRUNGEN=$(node -e "console.log(JSON.parse(require('fs').readFileSync('preisupdate-meta.json','utf8')).uebersprungen)")
          PRUEFEN=$(node -e "console.log(JSON.parse(require('fs').readFileSync('preisupdate-meta.json','utf8')).pruefen)")

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add geraete-katalog.json ankauf-preise.json ankauf/ preisupdate-meta.json scripts/rotation-state.json logs/
          git commit -m "Auto-Preisupdate ${DATUM} (${AKTUALISIERT} Geräte aktualisiert, ${UEBERSPRUNGEN} übersprungen, ${PRUEFEN} Prüffälle)"
          git push

      - name: Lauf zusammenfassen
        if: ${{ always() }}
        run: |
          echo "## Automatische Ankaufspreise" >> "$GITHUB_STEP_SUMMARY"
          if [ -f preisupdate-meta.json ]; then
            node -e "const m=require('./preisupdate-meta.json'); console.log('| Datum | Aktualisiert | Übersprungen | Sicherheitsfälle | Avatel-Treffer |\n|---|---:|---:|---:|---:|\n| '+m.datum+' | '+m.aktualisiert+' | '+m.uebersprungen+' | '+m.pruefen+' | '+(m.wettbewerbTreffer||0)+' |')" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Der Lauf wurde vor der Preisberechnung beendet. Es wurden keine Preise veröffentlicht." >> "$GITHUB_STEP_SUMMARY"
          fi
