name: POS-Bestand mit Website synchronisieren

on:
  push:
    branches: [main]
    paths:
      - "bestand.json"
      - "scripts/build-produktseiten.js"
      - "scripts/sync-pos-bestand.js"
      - "scripts/pos-ankaufdeckel.js"
      - "scripts/wende-vk-sicherheitsdeckel.js"
      - "pos-bestand-client.js"
      - "produktseiten.css"
      - ".github/workflows/pos-bestand-sync.yml"
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

concurrency:
  group: pos-bestand-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Website laden
        uses: actions/checkout@v4

      - name: Node einrichten
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Aktuellen POS-Bestand laden
        run: npm run test:pos && node scripts/fetch-pos-bestand.js

      - name: Geschützte POS-Lerngrenzen laden
        shell: bash
        run: |
          OIDC_RESPONSE=$(curl --fail --silent --show-error -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=mrphone-pos-buyback-sync")
          OIDC_TOKEN=$(printf '%s' "$OIDC_RESPONSE" | node -e "let d='';process.stdin.on('data',c=>d+=c).on('end',()=>process.stdout.write(JSON.parse(d).value))")
          if ! curl --fail --silent --show-error -H "Authorization: Bearer $OIDC_TOKEN" "https://asabsxcfjdhedbeaudhi.supabase.co/functions/v1/ankauf-deckel" -o .pos-buyback-caps.json; then
            rm -f .pos-buyback-caps.json
            echo "POS-Lerngrenzen vorübergehend nicht verfügbar; Bestand wird ohne sie synchronisiert."
          fi

      - name: Bestand und Google-Seiten aktualisieren
        run: node scripts/sync-pos-bestand.js --apply

      - name: Vollständigkeit erneut prüfen
        run: node validate-data.js && npm run test:pos && npm run test:produkte && npm run test:seo

      - name: Änderungen veröffentlichen
        run: |
          if [ -z "$(git status --porcelain -- bestand.json ankauf-preise.json ankauf produkte sitemap.xml scripts/produktseiten-manifest.json)" ]; then
            echo "Keine Bestandsänderung – kein Commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add bestand.json ankauf-preise.json ankauf/ produkte/ sitemap.xml scripts/produktseiten-manifest.json
          git commit -m "chore(stock): sync public POS inventory"
          git push
