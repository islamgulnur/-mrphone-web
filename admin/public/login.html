<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin-Login – Mr. Phone</title>
<style>
  * { box-sizing: border-box; }
  body {
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    background: #0f172a;
    color: #e2e8f0;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    margin: 0;
    padding: 16px;
  }
  form {
    background: #1e293b;
    padding: 32px;
    border-radius: 12px;
    width: 100%;
    max-width: 340px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.3);
  }
  h1 { font-size: 1.25rem; margin: 0 0 20px; }
  label { display: block; font-size: 0.85rem; margin-bottom: 6px; color: #94a3b8; }
  input {
    width: 100%;
    padding: 10px 12px;
    margin-bottom: 16px;
    border-radius: 8px;
    border: 1px solid #334155;
    background: #0f172a;
    color: #e2e8f0;
    font-size: 1rem;
  }
  input:focus { outline: 2px solid #3b82f6; }
  button {
    width: 100%;
    padding: 10px 12px;
    border: none;
    border-radius: 8px;
    background: #3b82f6;
    color: #fff;
    font-size: 1rem;
    cursor: pointer;
  }
  button:hover { background: #2563eb; }
</style>
</head>
<body>
<form method="POST" action="/admin/login" autocomplete="on">
  <h1>Mr. Phone Admin</h1>
  <label for="email">E-Mail</label>
  <input type="email" id="email" name="email" required autofocus autocomplete="username">
  <label for="passwort">Passwort</label>
  <input type="password" id="passwort" name="passwort" required autocomplete="current-password">
  <button type="submit">Anmelden</button>
</form>
</body>
</html>
